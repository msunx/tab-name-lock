<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">标签定名 · 名字留下，状态有回应</title>
  <desc id="desc">Chrome 扩展：给当前标签页固定名称，在页面文字从指定状态 A 变为 B 时提醒。下方为自定义标签名称与发布状态转换示意。</desc>
  <rect width="1200" height="420" rx="24" fill="#201B29"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="56" y="62" fill="#C5A5F0" font-size="20" letter-spacing="2">CHROME EXTENSION</text>
    <text x="1144" y="62" fill="#B7ABC8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="end">TAB NAME LOCK</text>
    <text x="52" y="154" fill="#F2EDF8" font-size="76" font-weight="700">标签定名</text>
    <text x="56" y="216" fill="#F2EDF8" font-size="38">给标签页定名，让状态变化来提醒你。</text>
  </g>
  <g id="tab-and-transition" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <path d="M56 322V282a14 14 0 0 1 14-14h330a14 14 0 0 1 14 14v40" fill="#392D4D"/>
    <text x="80" y="304" fill="#F2EDF8" font-size="26" font-weight="600">🚀 演示环境</text>
    <path d="m375 290 10 10m0-10-10 10" fill="none" stroke="#B7ABC8" stroke-width="2" stroke-linecap="round"/>
    <text x="454" y="304" fill="#B7ABC8" font-size="24">📚 参考文档</text>
    <path d="M56 322h1088" stroke="#7E708D" stroke-width="1.5"/>
    <text x="80" y="369" fill="#B7ABC8" font-size="24">状态监听</text>
    <circle cx="249" cy="360" r="5" fill="#C5A5F0"/>
    <text x="270" y="369" fill="#F2EDF8" font-size="26">发布中</text>
    <path d="M382 360h78m-10-9 10 9-10 9" fill="none" stroke="#C5A5F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="482" y="369" fill="#C5A5F0" font-size="26" font-weight="600">发布完成</text>
    <text x="1120" y="369" fill="#B7ABC8" font-size="22" text-anchor="end">每次 A → B，提醒一次</text>
  </g>
</svg>
